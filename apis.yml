description: >-
  EIN Presswire, operated by Newsmatics Inc. of Washington, D.C., is a press release
  distribution service for businesses, agencies, nonprofits and public figures. Releases
  are submitted through its web form, editorially reviewed, and syndicated to AP News,
  the USA TODAY Network, Nexstar Media Group, Google News, Bing, Bloomberg Terminals,
  MuckRack, Moody's NewsEdge, Naviga and 3,900+ Affinity Group Publications, then
  published as RSS feeds broken out by industry, country and US state. Distribution is
  sold as prepaid packages rather than subscriptions, and there is no public developer
  API: the company's own FAQ states that press releases are only accepted through the
  website submission form.
